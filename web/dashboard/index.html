<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- REGLA 5: Viewport esencial para móviles -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoopWarden NOC View</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #050505;
        --card-bg: #101010;
        --border: #333;
        --text: #ccc;
        --crit: #ff003c;
        --warn: #ff9a00;
        --info: #00d9f7;
        --btn-hover: #ffffff;
    }
    
    /* REGLA 12: Box Model Global */
    * { box-sizing: border-box; }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: 'JetBrains Mono', monospace;
        margin: 0; padding: 20px; /* Cuidado: en móviles muy pequeños 20px puede ser mucho, pero lo mantengo */
        font-size: 11px;
        overflow-y: scroll;
        overflow-x: hidden; /* Seguridad extra */
    }

    /* --- LAYOUT DE DÍA --- */
    .day-container {
        margin-bottom: 25px;
        border-top: 1px solid #222;
        padding-top: 10px;
    }
    .day-header {
        font-size: 14px;
        font-weight: 800;
        color: #555;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .day-header.empty-day {
        color: #222;
        font-weight: 400;
        font-style: italic;
    }

    /* --- GRID FIJA (SOLUCIÓN DEFINITIVA) --- */
    .grid {
        display: grid;
        /* 
           CAMBIO CRÍTICO:
           Quitamos '1fr'. Usamos '150px' fijo.
           Esto obliga a que las columnas sean siempre de 150px.
           Si hay 3 eventos, ocuparán 450px + huecos y el resto quedará vacío a la derecha.
           No se estirarán.
        */
        grid-template-columns: repeat(auto-fill, 150px); 
        gap: 8px;
        /* Aseguramos que se alineen al inicio (izquierda) */
        justify-content: start;
    }

    /* --- TARJETA --- */
    .card {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-left: 3px solid #555;
        padding: 8px;
        height: 115px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
        transition: transform 0.1s;
        /* Seguridad para evitar scroll horizontal por contenido largo */
        overflow: hidden; 
    }
    
    .card:hover { border-color: #666; z-index: 10; transform: scale(1.02); }

    .card.crit { border-left-color: var(--crit); }
    .card.warn { border-left-color: var(--warn); }
    .card.info { border-left-color: var(--info); }

    /* Flash para eventos nuevos (< 60s) */
    .flash { animation: blink-red 1s infinite alternate; }
    @keyframes blink-red {
        from { box-shadow: 0 0 2px var(--crit); background: #1a0505; }
        to { box-shadow: 0 0 10px var(--crit); background: #350000; }
    }

    /* Elementos de la tarjeta */
    .card-meta {
        display: flex; justify-content: space-between;
        font-size: 9px; opacity: 0.6; text-transform: uppercase;
        margin-bottom: 4px;
    }
    
    .card-title {
        font-weight: 700; color: #fff;
        font-size: 10px;
        line-height: 1.2;
        margin-bottom: 6px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word; /* Evita que palabras largas rompan el ancho */
    }

    .card-mac-box {
        background: #000;
        color: #ddd;
        font-family: monospace;
        text-align: center;
        padding: 3px 0;
        font-size: 10px;
        border: 1px solid #333;
        margin-bottom: auto;
    }

    .card-footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
    }

    .card-loc {
        font-size: 9px; color: var(--warn);
        font-weight: bold;
        white-space: nowrap; /* Evita saltos de línea feos en el footer */
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 80%;
    }

    .btn-details {
        width: 18px; height: 18px;
        border-radius: 50%;
        border: 1px solid #555;
        color: #555;
        font-size: 11px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
        flex-shrink: 0; /* Asegura que el botón no se aplaste */
    }
    .btn-details:hover {
        background: #fff;
        color: #000;
        border-color: #fff;
        box-shadow: 0 0 8px rgba(255,255,255,0.5);
    }

    /* --- MODAL (POPUP) --- */
    #modal {
        display: none;
        position: fixed; z-index: 1000;
        left: 0; top: 0; width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.85);
        backdrop-filter: blur(4px);
    }
    #modal-content {
        background-color: #111;
        margin: 5% auto;
        padding: 20px;
        border: 1px solid #444;
        width: 90%; /* Ajustado para móviles (antes 60%) */
        max-width: 800px;
        box-shadow: 0 0 30px rgba(0,0,0,0.8);
        color: #eee;
    }
    .modal-header {
        font-size: 18px; font-weight: bold;
        margin-bottom: 15px;
        border-bottom: 1px solid #333;
        padding-bottom: 10px;
        display: flex; justify-content: space-between;
    }
    .close-modal { cursor: pointer; color: #888; font-size: 24px; }
    .close-modal:hover { color: #fff; }

    .raw-log {
        background: #000;
        padding: 15px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        white-space: pre-wrap; 
        line-height: 1.5;
        border-left: 4px solid var(--info);
        max-height: 70vh;
        overflow-y: auto;
    }
    
    #status { position: fixed; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: #333; }
    #status.live { background: #0f0; box-shadow: 0 0 5px #0f0; }
    #status.error { background: #f00; }

</style>
</head>
<body>

<div id="status"></div>
<div id="app"></div>

<!-- MODAL -->
<div id="modal">
    <div id="modal-content">
        <div class="modal-header">
            <span id="m-title">EVENT DETAILS</span>
            <span class="close-modal" onclick="closeModal()">&times;</span>
        </div>
        <div id="m-body" class="raw-log"></div>
    </div>
</div>

<script>
    // --- JS INTACTO ---
    const APP = document.getElementById('app');
    const API = 'api.php';
    let lastHash = '';

    function strToDate(s) { return new Date(s.replace(/\//g, '-')); }
    function dateToStr(d) { return d.toISOString().split('T')[0].replace(/-/g, '/'); }

    async function loop() {
        try {
            const res = await fetch(API);
            const data = await res.json();
            
            const jsonStr = JSON.stringify(data[0] || {}); 
            if(jsonStr === lastHash && data.length > 0) return; 
            lastHash = jsonStr;

            render(data);
            document.getElementById('status').className = 'live';
        } catch(e) {
            console.error("API Fetch Error:", e);
            document.getElementById('status').className = 'error';
        }
    }

    function render(data) {
        APP.innerHTML = '';
        if(data.length === 0) return;

        const groups = {};
        data.forEach(ev => {
            const day = ev.ts.split(' ')[0];
            if(!groups[day]) groups[day] = [];
            groups[day].push(ev);
        });

        const sortedDays = Object.keys(groups).sort((a,b) => strToDate(b) - strToDate(a));
        if(sortedDays.length === 0) return;

        const newestDate = strToDate(sortedDays[0]);
        const oldestDate = strToDate(sortedDays[sortedDays.length - 1]);

        let current = newestDate;
        while(current >= oldestDate) {
            const dayStr = dateToStr(current);
            const events = groups[dayStr] || [];

            const dayDiv = document.createElement('div');
            dayDiv.className = 'day-container';
            
            const header = document.createElement('div');
            header.className = `day-header ${events.length === 0 ? 'empty-day' : ''}`;
            header.innerHTML = `<span>📅 ${dayStr}</span> <span>${events.length}</span>`;
            dayDiv.appendChild(header);

            if(events.length > 0) {
                const grid = document.createElement('div');
                grid.className = 'grid';
                events.forEach(ev => grid.appendChild(buildCard(ev)));
                dayDiv.appendChild(grid);
            } else {
                const empty = document.createElement('div');
                empty.style.color="#333"; empty.style.fontStyle="italic"; empty.innerText="-- No events --";
                dayDiv.appendChild(empty);
            }

            APP.appendChild(dayDiv);
            current.setDate(current.getDate() - 1);
        }
    }

    function buildCard(ev) {
        const el = document.createElement('div');
        let sev = 'info';
        const t = ev.title.toUpperCase();
        if(t.includes('LOOP') || t.includes('STORM') || t.includes('ROGUE')) sev = 'crit';
        else if(t.includes('FLOOD') || t.includes('HIGH')) sev = 'warn';
        
        const evTime = strToDate(ev.ts);
        const isNew = (new Date() - evTime) < 60000;

        el.className = `card ${sev} ${isNew ? 'flash' : ''}`;

        const timeOnly = ev.ts.split(' ')[1];
        let loc = ev.iface;
        if(ev.ip) loc += ` <span style="color:#fff">${ev.ip}</span>`;

        // Regex para limpiar el título
        const cleanDisplayTitle = ev.title.replace(/[^\w\s\(\)-]/gi, '');

        // Usamos Template Literals (Regla 25)
        el.innerHTML = `
            <div class="card-meta">
                <span>${ev.engine}</span>
                <span>${timeOnly}</span>
            </div>
            <div class="card-title" title="${ev.title}">
                ${cleanDisplayTitle}
            </div>
            <div class="card-mac-box">
                ${ev.mac || '---'}
            </div>
            <div class="card-footer">
                <div class="card-loc">${loc}</div>
                <div class="btn-details" data-ev='${JSON.stringify(ev).replace(/'/g, "&#39;")}' onclick='openModalFromData(this)'>?</div>
            </div>
        `;
        return el;
    }

    window.openModalFromData = function(elem) {
        const data = JSON.parse(elem.getAttribute('data-ev'));
        window.openModal(data);
    }

    const modal = document.getElementById('modal');
    const mBody = document.getElementById('m-body');
    const mTitle = document.getElementById('m-title');

    window.openModal = function(ev) {
        mTitle.innerText = `${ev.ts} - ${ev.engine}`;
        const rawText = Array.isArray(ev.full_text) ? ev.full_text.join("\n") : ev.full_text;
        mBody.innerText = rawText; 
        modal.style.display = "block";
    }

    window.closeModal = function() {
        modal.style.display = "none";
    }
    window.onclick = function(event) {
        if (event.target == modal) modal.style.display = "none";
    }

    async function wakeLock() {
        if('wakeLock' in navigator) try { await navigator.wakeLock.request('screen'); } catch(e){}
    }
    document.addEventListener('click', wakeLock);
    wakeLock();

    setInterval(loop, 2000);
    loop();

</script>

<video id="keep-awake" autoplay muted loop playsinline style="display:none">
    <source src="data:video/mp4;base64,AAAAHGZ0eXBtcDQyAAAAAG1wNDFtcDQyAAAAAG1vb3YAAA==" type="video/mp4">
</video>

<script>
async function keepScreenAwake() {
    if ('wakeLock' in navigator) {
        let wakeLock = null;
        const requestWakeLock = async () => {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { console.error('Wake Lock failed:', err); }
        };
        requestWakeLock();
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
        });
    }
    const vid = document.getElementById('keep-awake');
    if (vid) vid.play().catch(()=>{});
    
    setInterval(() => {
        document.body.style.backgroundColor =
            document.body.style.backgroundColor === "var(--bg)" ? "#050506" : "var(--bg)";
    }, 30000);
}
keepScreenAwake();
</script>
</body>
</html>
